[workspace]
members = ["crates/lightwell-app", "crates/lightwell-core", "crates/lightwell-cli"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/moonbase2090/lightwell"
rust-version = "1.85"

[workspace.dependencies]
fs2 = "0.4"
glob = "0.3"
notify-debouncer-mini = "0.7"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
syn = { version = "2", features = ["full"] }
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
toml = "0.8"
