[workspace]
members = ["crates/lightwell-core", "crates/lightwell-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/moonbase2090/lightwell"
rust-version = "1.85"

[workspace.dependencies]
glob = "0.3"
notify-debouncer-mini = "0.7"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
toml = "0.8"
