[workspace]
members = ["crates/lightwell-app", "crates/lightwell-core", "crates/lightwell-cli"]
resolver = "2"

[workspace.package]
version = "0.1.25"
edition = "2021"
license = "MIT"
repository = "https://github.com/moonbase2090/lightwell"
rust-version = "1.90"

[workspace.dependencies]
fs2 = "0.4"
glob = "0.3"
notify-debouncer-mini = "0.7"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
syn = { version = "2", features = ["full"] }
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"
tempfile = "3.27"
toml = "0.8"
yaml-rust2 = "0.13"

# crates.io has yanked every zip release except 9.0.3 and 9.0.4.
# tauri-plugin-updater 2.14 still requires zip 4, so resolve that line from the tag.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v4.6.1" }
