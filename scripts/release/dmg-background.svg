<!-- Layout ported from Prismattyc; deep indigo wash so the white arrow stays visible. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#wash)"/>
  <circle cx="300" cy="206" r="124" fill="#6366f1" opacity="0.28" filter="url(#soft-shadow)"/>
  <path d="M276 108h48" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="300" y="82" text-anchor="middle" fill="#ffffff"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25" font-weight="600" letter-spacing="-0.4">Drag to Applications</text>
  <path d="M218 204h157" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="m357 184 22 20-22 20" fill="none" stroke="#ffffff"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
