name: Links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check links while release assets are pending
        if: github.event_name == 'push' || startsWith(github.head_ref, 'release/')
        uses: moonbase2090/.github/actions/package-links@0f192a5bb8fa198ab154fb4f721bdd8ca0813946
        with:
          link-excludes: >-
            --exclude
            '^https://github\.com/moonbase2090/lightwell/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Lightwell_[0-9]+\.[0-9]+\.[0-9]+_(aarch64\.dmg|universal\.dmg|amd64\.deb|amd64\.AppImage|x86_64\.rpm|linux_(x86_64|aarch64)\.tar\.gz|x64\.msi)$'
      - name: Check all links
        if: github.event_name != 'push' && !startsWith(github.head_ref, 'release/')
        uses: moonbase2090/.github/actions/package-links@0f192a5bb8fa198ab154fb4f721bdd8ca0813946
