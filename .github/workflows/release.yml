name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Full release tag to build, such as v0.1.0
        required: true
        type: string
      dry_run:
        description: Build, sign, and notarize without publishing
        default: true
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag, dispatch mode, and package versions
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?}"
          if [[ "$tag" != v* ]]; then
            echo 'release tag must start with v' >&2
            exit 1
          fi
          version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./crates/lightwell-app/tauri.conf.json').version")"
          pkgbuild_version="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          if [[ "$version" != "$pkgbuild_version" ]]; then
            echo "tag $version must match packaging/arch/PKGBUILD pkgver ($pkgbuild_version)" >&2
            exit 1
          fi
          if [[ "$version" != "$pkg_version" || "$version" != "$tauri_version" ]]; then
            echo "tag $version must match package.json ($pkg_version) and tauri.conf.json ($tauri_version)" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            if [[ "${RELEASE_DRY_RUN}" != true && ( "${GITHUB_REF_TYPE}" != tag || "${GITHUB_REF_NAME}" != "$tag" ) ]]; then
              echo 'publishing requires dispatching the matching existing tag' >&2
              exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Validated $tag"

  macos-signed:
    name: Signed macOS app
    needs: validate
    if: ${{ vars.LIGHTWELL_MACOS_SIGNING == 'true' }}
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Keep build machine paths out of release binaries
        run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - name: Build the unsigned app for signing
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app --no-sign
      - name: Bundle the command line tool
        run: scripts/ci/bundle-macos-cli.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app aarch64-apple-darwin
      - name: Sign and verify the Apple Silicon app
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/sign-macos-app.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app
      - name: Notarize, staple, and validate the app
        env:
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/notarize-macos-app.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell-macos-arm64.zip"
      - name: Check the deployment target
        run: scripts/ci/check-macos-minimum.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app 11.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dmgbuild
        run: python3 -m pip install --disable-pip-version-check 'dmgbuild==1.6.7'
      - name: Build the drag-to-Applications disk image
        run: scripts/ci/build-macos-dmg.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_aarch64.dmg"
      - name: Sign the disk image
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/sign-macos-app.sh --dmg "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_aarch64.dmg"
      - name: Notarize, staple, and validate the disk image
        env:
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/notarize-macos-app.sh "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_aarch64.dmg"
      - name: Pack the signed app for the updater
        run: scripts/ci/pack-macos-update.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_aarch64.app.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            ${{ runner.temp }}/Lightwell_${{ needs.validate.outputs.version }}_aarch64.dmg
            ${{ runner.temp }}/Lightwell_${{ needs.validate.outputs.version }}_aarch64.app.tar.gz
          if-no-files-found: error

  macos-unsigned:
    name: Unsigned macOS app
    needs: validate
    if: ${{ vars.LIGHTWELL_MACOS_SIGNING != 'true' }}
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Keep build machine paths out of release binaries
        run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - name: Build the unsigned Apple Silicon app
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app --no-sign
      - name: Bundle the command line tool
        run: scripts/ci/bundle-macos-cli.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app aarch64-apple-darwin
      - name: Confirm the app is unsigned
        run: scripts/ci/check-unsigned-macos-app.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app
      - name: Check the deployment target
        run: scripts/ci/check-macos-minimum.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app 11.0
      - name: Zip the app
        run: ditto -c -k --keepParent target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_aarch64-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64-unsigned
          path: ${{ runner.temp }}/Lightwell_${{ needs.validate.outputs.version }}_aarch64-unsigned.zip
          if-no-files-found: error

  macos-universal-signed:
    name: Signed macOS universal app
    needs: validate
    if: ${{ vars.LIGHTWELL_MACOS_SIGNING == 'true' }}
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Keep build machine paths out of release binaries
        run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - name: Build the unsigned app for signing
        run: npm run tauri:build -- --target universal-apple-darwin --bundles app --no-sign
      - name: Bundle the command line tool
        run: scripts/ci/bundle-macos-cli.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app aarch64-apple-darwin x86_64-apple-darwin
      - name: Sign and verify the universal app
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/sign-macos-app.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app
      - name: Notarize, staple, and validate the app
        env:
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/notarize-macos-app.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell-macos-universal.zip"
      - name: Check both architectures are present
        run: |
          lipo target/universal-apple-darwin/release/bundle/macos/Lightwell.app/Contents/MacOS/lightwell -verify_arch arm64 x86_64
          lipo target/universal-apple-darwin/release/bundle/macos/Lightwell.app/Contents/Resources/bin/lightwell -verify_arch arm64 x86_64
      - name: Check the deployment target
        run: scripts/ci/check-macos-minimum.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app 11.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dmgbuild
        run: python3 -m pip install --disable-pip-version-check 'dmgbuild==1.6.7'
      - name: Build the drag-to-Applications disk image
        run: scripts/ci/build-macos-dmg.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_universal.dmg"
      - name: Sign the disk image
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/sign-macos-app.sh --dmg "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_universal.dmg"
      - name: Notarize, staple, and validate the disk image
        env:
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/notarize-macos-app.sh "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_universal.dmg"
      - name: Pack the signed universal app for the updater
        run: scripts/ci/pack-macos-update.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_universal.app.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: |
            ${{ runner.temp }}/Lightwell_${{ needs.validate.outputs.version }}_universal.dmg
            ${{ runner.temp }}/Lightwell_${{ needs.validate.outputs.version }}_universal.app.tar.gz
          if-no-files-found: error

  macos-universal-unsigned:
    name: Unsigned macOS universal app
    needs: validate
    if: ${{ vars.LIGHTWELL_MACOS_SIGNING != 'true' }}
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Keep build machine paths out of release binaries
        run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - name: Build the unsigned universal app
        run: npm run tauri:build -- --target universal-apple-darwin --bundles app --no-sign
      - name: Bundle the command line tool
        run: scripts/ci/bundle-macos-cli.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app aarch64-apple-darwin x86_64-apple-darwin
      - name: Confirm the app is unsigned
        run: scripts/ci/check-unsigned-macos-app.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app
      - name: Check both architectures are present
        run: |
          lipo target/universal-apple-darwin/release/bundle/macos/Lightwell.app/Contents/MacOS/lightwell -verify_arch arm64 x86_64
          lipo target/universal-apple-darwin/release/bundle/macos/Lightwell.app/Contents/Resources/bin/lightwell -verify_arch arm64 x86_64
      - name: Check the deployment target
        run: scripts/ci/check-macos-minimum.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app 11.0
      - name: Zip the app
        run: ditto -c -k --keepParent target/universal-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell_${RELEASE_VERSION}_universal-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal-unsigned
          path: ${{ runner.temp }}/Lightwell_${{ needs.validate.outputs.version }}_universal-unsigned.zip
          if-no-files-found: error

  linux-deb:
    name: Linux glibc 2.28 packages
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config xvfb xdotool imagemagick libarchive-tools
      - run: cargo install --locked cargo-zigbuild --version 0.23.4
      - run: npm ci
      - name: Keep build machine paths out of release binaries
        run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - name: Build the deb, AppImage, and rpm for the GLIBC 2.28 floor
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri:build -- --runner cargo-zigbuild --target x86_64-unknown-linux-gnu --bundles deb,appimage,rpm --no-sign
      - name: Check the package binary's GLIBC requirement
        run: scripts/ci/check-deb-glibc.sh target/x86_64-unknown-linux-gnu/release/bundle/deb 2.28
      - name: Keep the desktop app binary before the CLI build reuses its path
        run: cp target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-app"
      - name: Build the CLI with a glibc 2.28 floor
        run: scripts/ci/build-linux-cli.sh x86_64-unknown-linux-gnu
      - name: Check the CLI and desktop app GLIBC requirement
        run: |
          scripts/ci/check-glibc-floor.sh target/x86_64-unknown-linux-gnu/release/lightwell 2.28
          scripts/ci/check-glibc-floor.sh "$RUNNER_TEMP/lightwell-app" 2.28
      - name: Collect the Linux release assets
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-linux
          bundle=target/x86_64-unknown-linux-gnu/release/bundle
          cp "$bundle/deb/Lightwell_${RELEASE_VERSION}_amd64.deb" dist-linux/
          cp "$bundle/appimage/Lightwell_${RELEASE_VERSION}_amd64.AppImage" dist-linux/
          cp "$bundle/rpm/Lightwell-${RELEASE_VERSION}-1.x86_64.rpm" "dist-linux/Lightwell_${RELEASE_VERSION}_x86_64.rpm"
          scripts/ci/package-linux-tarball.sh "$RELEASE_VERSION" x86_64 \
            target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-app" dist-linux
          ls -l dist-linux
      - name: Smoke the AppImage, rpm, deb, and tarball headless
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/ci/smoke-linux-bundles.sh "$RELEASE_VERSION" "$GITHUB_WORKSPACE/dist-linux" "$RUNNER_TEMP/linux-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist-linux/*
          if-no-files-found: error

  linux-arm64-cli:
    name: Linux aarch64 CLI tarball
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cargo-zigbuild and Zig
        run: scripts/ci/setup-zigbuild.sh
      - name: Keep build machine paths out of release binaries
        run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - name: Build the CLI with a glibc 2.28 floor
        run: scripts/ci/build-linux-cli.sh aarch64-unknown-linux-gnu
      - name: Check the glibc floor and architecture
        run: |
          scripts/ci/check-glibc-floor.sh target/aarch64-unknown-linux-gnu/release/lightwell 2.28
          file target/aarch64-unknown-linux-gnu/release/lightwell | grep -q 'ARM aarch64'
      - name: Package the CLI tarball
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/ci/package-linux-tarball.sh "$RELEASE_VERSION" aarch64 target/aarch64-unknown-linux-gnu/release/lightwell - dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-aarch64
          path: dist-linux/*.tar.gz
          if-no-files-found: error

  linux-al2023-smoke:
    name: Amazon Linux 2023 CLI smoke
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install cargo-zigbuild and Zig
        run: scripts/ci/setup-zigbuild.sh
      - name: Build the CLI with a glibc 2.28 floor
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: scripts/ci/build-linux-cli.sh "$TARGET"
      - name: Check the glibc floor and smoke on Amazon Linux 2023
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: scripts/ci/smoke-linux-al2023.sh "target/$TARGET/release" "$GITHUB_WORKSPACE"

  windows-msi:
    name: Windows x64 MSI
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: MSI helper tests
        run: python scripts/release/windows_msi_test.py
      - name: Decide whether Artifact Signing is configured
        id: signing
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: python scripts/release/signing_decision.py
      - name: Keep build machine paths out of release binaries
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          "RUSTFLAGS=--remap-path-prefix=$cargoHome=/cargo --remap-path-prefix=$env:GITHUB_WORKSPACE=/build" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build native Windows binaries
        shell: pwsh
        run: ./scripts/release/build-windows.ps1 -SkipPackage
      - name: Sign in to Azure
        if: steps.signing.outputs.enabled == 'True'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executables
        if: steps.signing.outputs.enabled == 'True'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\build\windows-release\payload\Lightwell.exe
            ${{ github.workspace }}\build\windows-release\payload\bin\lightwell.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Package the MSI
        shell: pwsh
        run: |
          if ('${{ steps.signing.outputs.enabled }}' -eq 'True') {
            ./scripts/release/build-windows.ps1 -SkipBuild -Signed -Payload build/windows-release/payload
          } else {
            ./scripts/release/build-windows.ps1 -SkipBuild -Payload build/windows-release/payload
          }
      - name: Record the MSI path
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath build\windows-release -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI was not packaged.' }
          "path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Sign the MSI
        if: steps.signing.outputs.enabled == 'True'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ steps.msi.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify signatures
        if: steps.signing.outputs.enabled == 'True'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool verify is not available.' }
          $files = @(
            'build\windows-release\payload\Lightwell.exe',
            'build\windows-release\payload\bin\lightwell.exe',
            '${{ steps.msi.outputs.path }}'
          )
          foreach ($file in $files) {
            & $signtool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Signature check failed for $file" }
          }
      # The publish job writes SHA256SUMS over the final, signed MSI.
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [validate, macos-signed, macos-unsigned, macos-universal-signed, macos-universal-unsigned, linux-deb, linux-arm64-cli, linux-al2023-smoke, windows-msi]
    if: >-
      ${{
        !cancelled() &&
        needs.validate.result == 'success' &&
        needs.linux-deb.result == 'success' &&
        needs.linux-arm64-cli.result == 'success' &&
        needs.linux-al2023-smoke.result == 'success' &&
        needs.windows-msi.result == 'success' &&
        (needs.macos-signed.result == 'success' || needs.macos-unsigned.result == 'success') &&
        (needs.macos-universal-signed.result == 'success' || needs.macos-universal-unsigned.result == 'success') &&
        !contains(needs.*.result, 'failure') &&
        !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
        (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          asset_count=$(find dist -maxdepth 1 -type f | wc -l)
          if [[ "$asset_count" -eq 0 ]]; then
            echo 'no release assets were downloaded' >&2
            exit 1
          fi
          for asset in dist/*; do
            name="$(basename "$asset")"
            if [[ "$name" != "Lightwell_${RELEASE_VERSION}_"* ]]; then
              echo "release asset $name does not carry version $RELEASE_VERSION" >&2
              exit 1
            fi
          done
          cd dist
          sha256sum * > SHA256SUMS
      - name: Build release notes from the tag message
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/ci/release-notes-from-tag.sh "$RELEASE_TAG" release-notes.md
      - name: Check release text
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_DENYLIST: ${{ secrets.RELEASE_DENYLIST }}
        run: |
          set -euo pipefail
          mkdir -p build/release-text
          scripts/ci/release-notes-from-tag.sh "$RELEASE_TAG" build/release-text/tag-message.txt
          printf '%s\n' "$RELEASE_TAG" > build/release-text/title.txt
          scripts/check-release-text.sh \
            --root "$GITHUB_WORKSPACE" \
            --extra release-notes.md \
            --extra build/release-text/title.txt \
            --extra build/release-text/tag-message.txt \
            --artifact dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign updater artifacts
        env:
          LIGHTWELL_RELEASE_REQUIRE_UPDATER_SIGNING: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/ci/publish-update-manifest.sh dist release-notes.md "$RELEASE_VERSION" "$RELEASE_TAG"
          if [[ -f dist/latest.json ]]; then
            cd dist
            files=()
            for file in Lightwell_*.sig latest.json; do
              if [[ -f "$file" ]]; then
                files+=("$file")
              fi
            done
            if [[ ${#files[@]} -gt 0 ]]; then
              sha256sum "${files[@]}" >> SHA256SUMS
            fi
          fi
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            dist/*
