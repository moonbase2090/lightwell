name: CI

on:
  pull_request:
    branches: [main, "m2/**"]

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: npm run check:licenses
      - name: Test the Linux release checks
        run: scripts/ci/test-release-checks.sh
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test -p lightwell-app --bin lightwell --locked
      - run: cargo test -p lightwell-core --lib --locked
      - name: Exercise project note save, stale marking, and removal
        run: |
          cargo build --locked -p lightwell-cli
          scripts/smoke-project-notes.sh "$GITHUB_WORKSPACE/target/debug/lightwell"
      - name: Extract a schema-v1 map with the Rust CLI
        run: |
          cargo run --quiet --locked -p lightwell-cli -- --help
          cargo run --quiet --locked -p lightwell-cli -- open --help
          cargo run --quiet --locked -p lightwell-cli -- extract . -o "$RUNNER_TEMP/lightwell-cli-map.json" --name Lightwell
          node_modules/.bin/tsx scripts/check-map.ts "$RUNNER_TEMP/lightwell-cli-map.json"
      - name: Watch a Rust source change with the Rust CLI
        run: node scripts/check-live-refresh.mjs "$GITHUB_WORKSPACE/target/debug/lightwell"
      - name: Serialize a Rust schema-v1 map
        run: cargo run --quiet --locked -p lightwell-core --example schema_v1 > "$RUNNER_TEMP/lightwell-schema-v1.json"
      - name: Validate the Rust map with the viewer schema
        run: node_modules/.bin/tsx scripts/check-map.ts "$RUNNER_TEMP/lightwell-schema-v1.json"
      - name: Compare Rust extraction with Prismattyc and Scorecard maps
        run: node scripts/check-rust-map-parity.mjs
      - name: Compare Cargo metadata with no-Cargo manifest and source discovery
        run: |
          mkdir -p "$RUNNER_TEMP/no-cargo"
          for project in . crates/lightwell-core/fixtures/no-cargo-workspace; do
            cargo run --quiet --locked -p lightwell-core --example cargo_metadata -- "$project" > "$RUNNER_TEMP/with-cargo.txt"
            env -i PATH="$RUNNER_TEMP/no-cargo" "$GITHUB_WORKSPACE/target/debug/examples/cargo_metadata" "$project" > "$RUNNER_TEMP/without-cargo.txt"
            diff -u "$RUNNER_TEMP/with-cargo.txt" "$RUNNER_TEMP/without-cargo.txt"
            cat "$RUNNER_TEMP/without-cargo.txt"
          done
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: moonbase2090/Scorecard/action@v0.1.6
        with:
          fail-on: types,tests,crap,secrets,lint
          diff: origin/${{ github.base_ref }}

  macos-cli:
    name: macOS CLI (minimum 11.0)
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build the CLI
        run: cargo build --release --locked -p lightwell-cli
      - name: Smoke the CLI
        run: scripts/ci/smoke-cli.sh target/release/lightwell "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lightwell-map.json"
      - name: Check the minimum macOS version
        run: scripts/ci/check-macos-minimum.sh target/release/lightwell 11.0
      - name: Test the macOS release checks
        run: scripts/ci/test-release-checks.sh

  linux-cli-al2023:
    name: Linux CLI glibc 2.28 + AL2023 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild and Zig
        run: scripts/ci/setup-zigbuild.sh
      - name: Build the CLI with a glibc 2.28 floor
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ci/build-linux-cli.sh "$TARGET"
      - name: Check the glibc floor and smoke on Amazon Linux 2023
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ci/smoke-linux-al2023.sh "target/$TARGET/release" "$GITHUB_WORKSPACE"

  tauri-macos-artifact:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Prove the bundled CLI lands on PATH
        run: scripts/ci/test-macos-cli-path.sh
      - name: Build the unsigned Apple Silicon app
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app --no-sign
      - name: Bundle the command line tool
        run: scripts/ci/bundle-macos-cli.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app aarch64-apple-darwin
      - name: Check the deployment target and unsigned bundle
        run: |
          app='target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app'
          scripts/ci/check-macos-minimum.sh "$app" 11.0
          scripts/ci/check-unsigned-macos-app.sh "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Lightwell-macos-arm64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightwell-macos-arm64-unsigned
          path: ${{ runner.temp }}/Lightwell-macos-arm64.zip
          if-no-files-found: error

  tauri-macos-signed:
    # Runs only once Apple signing is configured; until then macOS ships unsigned.
    # Signs the universal build, the release path with the most moving parts.
    if: ${{ vars.LIGHTWELL_MACOS_SIGNING == 'true' }}
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Apple signing credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/sign-macos-app.sh --credential-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Build the unsigned app for signing
        run: npm run tauri:build -- --target universal-apple-darwin --bundles app --no-sign
      - name: Bundle the command line tool
        run: scripts/ci/bundle-macos-cli.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app aarch64-apple-darwin x86_64-apple-darwin
      - name: Sign and verify the universal app
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/sign-macos-app.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app
      - name: Notarize, staple, and validate the app
        env:
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/notarize-macos-app.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell-macos-universal.zip"
      - name: Check both architectures and the deployment target
        run: |
          lipo target/universal-apple-darwin/release/bundle/macos/Lightwell.app/Contents/MacOS/lightwell -verify_arch arm64 x86_64
          lipo target/universal-apple-darwin/release/bundle/macos/Lightwell.app/Contents/Resources/bin/lightwell -verify_arch arm64 x86_64
          scripts/ci/check-macos-minimum.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app 11.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dmgbuild
        run: python3 -m pip install --disable-pip-version-check 'dmgbuild==1.6.7'
      - name: Build the drag-to-Applications disk image
        run: scripts/ci/build-macos-dmg.sh target/universal-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell-macos-universal.dmg"
      - name: Sign the disk image
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/sign-macos-app.sh --dmg "$RUNNER_TEMP/Lightwell-macos-universal.dmg"
      - name: Notarize, staple, and validate the disk image
        env:
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/notarize-macos-app.sh "$RUNNER_TEMP/Lightwell-macos-universal.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightwell-macos-universal-signed
          path: ${{ runner.temp }}/Lightwell-macos-universal.dmg
          if-no-files-found: error

  tauri-linux-artifact:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file imagemagick libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config xvfb xdotool xclip tesseract-ocr libarchive-tools
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.4
      - run: npm ci
      - name: Keep build machine paths out of the binaries, as the release does
        run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - name: Build the Linux packages for the GLIBC 2.28 floor
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri:build -- --runner cargo-zigbuild --target x86_64-unknown-linux-gnu --bundles deb,appimage,rpm --no-sign
      - name: Capture the empty workspace screen from the built app
        run: scripts/ci/capture-open-workspace.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-open-workspace.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightwell-open-workspace-linux-screenshot
          path: ${{ runner.temp }}/lightwell-open-workspace.png
          if-no-files-found: error
      - name: Capture the live map before and after a Rust source edit
        id: live_refresh_capture
        run: scripts/ci/capture-live-refresh.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-live-refresh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.live_refresh_capture.outcome != 'skipped'
        with:
          name: lightwell-live-refresh-linux-screenshots
          path: ${{ runner.temp }}/lightwell-live-refresh/
          if-no-files-found: error
      - name: Capture project note editing and stale marking from the built app
        id: notes_capture
        run: scripts/ci/capture-project-notes.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-project-notes"
      - name: Upload project notes failure diagnostics
        if: failure() && steps.notes_capture.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightwell-project-notes-failure-debug
          path: ${{ runner.temp }}/lightwell-project-notes/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.notes_capture.outcome == 'success'
        with:
          name: lightwell-project-notes-linux-screenshots
          path: ${{ runner.temp }}/lightwell-project-notes/*.png
          if-no-files-found: error
      - name: Capture the source inspector and editor settings from the built app
        id: source_inspector_capture
        run: scripts/ci/capture-source-inspector.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-source-inspector"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.source_inspector_capture.outcome == 'success'
        with:
          name: lightwell-source-inspector-linux-screenshots
          path: ${{ runner.temp }}/lightwell-source-inspector/*.png
          if-no-files-found: error
      - name: Exercise the theme picker in the built app
        env:
          CAPTURE_SPLITTERS: ${{ startsWith(github.head_ref, 'm2/draggable-rails') }}
        run: scripts/ci/capture-theme-picker.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-theme-picker" "$CAPTURE_SPLITTERS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightwell-theme-picker-linux-screenshots
          path: ${{ runner.temp }}/lightwell-theme-picker/*.png
          if-no-files-found: error
      - name: Exercise draggable rails and per-project restore
        if: startsWith(github.head_ref, 'm2/draggable-rails')
        run: scripts/ci/capture-splitters.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-splitters"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && startsWith(github.head_ref, 'm2/draggable-rails')
        with:
          name: lightwell-splitters-linux-screenshots
          path: ${{ runner.temp }}/lightwell-splitters/*.png
          if-no-files-found: error
      - name: Build the previous header and capture the compact layout
        if: startsWith(github.head_ref, 'm2/compact-header')
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          previous_header_sha="$(git log --first-parent --merges -1 --format=%H "$PR_HEAD_SHA")"
          if [[ -z "$previous_header_sha" ]]; then
            previous_header_sha="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          previous_source="$RUNNER_TEMP/lightwell-before-source"
          previous_app="$RUNNER_TEMP/lightwell-before"
          git worktree add --detach "$previous_source" "$previous_header_sha"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$previous_source/node_modules"
          (
            cd "$previous_source"
            npm run tauri:build -- --target x86_64-unknown-linux-gnu --no-bundle -- --locked
          )
          cp "$previous_source/target/x86_64-unknown-linux-gnu/release/lightwell" "$previous_app"
          scripts/ci/capture-compact-header.sh \
            "$previous_app" \
            "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/lightwell" \
            "$RUNNER_TEMP/lightwell-compact-header"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.head_ref, 'm2/compact-header')
        with:
          name: lightwell-compact-header-linux-screenshots
          path: ${{ runner.temp }}/lightwell-compact-header/*.png
          if-no-files-found: error
      - name: Check the package binary's GLIBC requirement
        run: scripts/ci/check-deb-glibc.sh target/x86_64-unknown-linux-gnu/release/bundle/deb 2.28
      - name: Open the packaged desktop app on WebKitGTK 4.1
        run: scripts/ci/smoke-deb-gui.sh target/x86_64-unknown-linux-gnu/release/bundle/deb "$RUNNER_TEMP/lightwell-deb-gui.png"
      - name: Package the CLI and desktop app tarball
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "LIGHTWELL_VERSION=$version" >> "$GITHUB_ENV"
          bundle=target/x86_64-unknown-linux-gnu/release/bundle
          mkdir -p "$RUNNER_TEMP/dist-linux"
          cp target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-app"
          scripts/ci/build-linux-cli.sh x86_64-unknown-linux-gnu
          cp "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage "$RUNNER_TEMP/dist-linux/"
          cp "$bundle/rpm/Lightwell-${version}-1.x86_64.rpm" "$RUNNER_TEMP/dist-linux/Lightwell_${version}_x86_64.rpm"
          scripts/ci/package-linux-tarball.sh "$version" x86_64 \
            target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-app" "$RUNNER_TEMP/dist-linux"
          ls -l "$RUNNER_TEMP/dist-linux"
      - name: Smoke the AppImage, rpm, deb, and tarball headless
        run: scripts/ci/smoke-linux-bundles.sh "$LIGHTWELL_VERSION" "$RUNNER_TEMP/dist-linux" "$RUNNER_TEMP/linux-smoke"
      - name: Check the Linux bundles pass the release text check
        env:
          RELEASE_DENYLIST: ${{ secrets.RELEASE_DENYLIST }}
        run: |
          set -euo pipefail
          # Same scan the publish job runs, including the checksum list.
          mkdir -p "$RUNNER_TEMP/text-check"
          cp "$RUNNER_TEMP"/dist-linux/* "$RUNNER_TEMP/text-check/"
          (cd "$RUNNER_TEMP/text-check" && sha256sum * > SHA256SUMS)
          scripts/check-release-text.sh --root "$GITHUB_WORKSPACE" --artifact "$RUNNER_TEMP/text-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightwell-linux-x86_64-glibc-2.28
          path: ${{ runner.temp }}/dist-linux/*
          if-no-files-found: error

  windows-check:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python scripts/release/windows_msi_test.py
      - run: cargo test -p lightwell-core --lib --locked
      - run: cargo test -p lightwell-cli --locked
      - run: cargo test -p lightwell-app --bin lightwell --locked
