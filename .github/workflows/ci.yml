name: CI

on:
  pull_request:
    branches: [main, "m2/**"]

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: npm run check:licenses
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test -p lightwell-app --bin lightwell --locked
      - run: cargo test -p lightwell-core --lib --locked
      - name: Exercise project note save, stale marking, and removal
        run: |
          cargo build --locked -p lightwell-cli
          scripts/smoke-project-notes.sh "$GITHUB_WORKSPACE/target/debug/lightwell"
      - name: Extract a schema-v1 map with the Rust CLI
        run: |
          cargo run --quiet --locked -p lightwell-cli -- --help
          cargo run --quiet --locked -p lightwell-cli -- open --help
          cargo run --quiet --locked -p lightwell-cli -- extract . -o "$RUNNER_TEMP/lightwell-cli-map.json" --name Lightwell
          node_modules/.bin/tsx scripts/check-map.ts "$RUNNER_TEMP/lightwell-cli-map.json"
      - name: Watch a Rust source change with the Rust CLI
        run: node scripts/check-live-refresh.mjs "$GITHUB_WORKSPACE/target/debug/lightwell"
      - name: Serialize a Rust schema-v1 map
        run: cargo run --quiet --locked -p lightwell-core --example schema_v1 > "$RUNNER_TEMP/lightwell-schema-v1.json"
      - name: Validate the Rust map with the viewer schema
        run: node_modules/.bin/tsx scripts/check-map.ts "$RUNNER_TEMP/lightwell-schema-v1.json"
      - name: Compare Rust extraction with Prismattyc and Scorecard maps
        run: node scripts/check-rust-map-parity.mjs
      - name: Compare Cargo metadata with no-Cargo manifest and source discovery
        run: |
          mkdir -p "$RUNNER_TEMP/no-cargo"
          for project in . crates/lightwell-core/fixtures/no-cargo-workspace; do
            cargo run --quiet --locked -p lightwell-core --example cargo_metadata -- "$project" > "$RUNNER_TEMP/with-cargo.txt"
            env -i PATH="$RUNNER_TEMP/no-cargo" "$GITHUB_WORKSPACE/target/debug/examples/cargo_metadata" "$project" > "$RUNNER_TEMP/without-cargo.txt"
            diff -u "$RUNNER_TEMP/with-cargo.txt" "$RUNNER_TEMP/without-cargo.txt"
            cat "$RUNNER_TEMP/without-cargo.txt"
          done
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: moonbase2090/Scorecard/action@v0.1.6
        with:
          fail-on: types,tests,crap,secrets,lint
          diff: origin/${{ github.base_ref }}

  macos-cli:
    name: macOS CLI (minimum 11.0)
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build the CLI
        run: cargo build --release --locked -p lightwell-cli
      - name: Smoke the CLI
        run: scripts/ci/smoke-cli.sh target/release/lightwell "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lightwell-map.json"
      - name: Check the minimum macOS version
        run: |
          minimum="$(otool -l target/release/lightwell | awk '$1 == "minos" { print $2; exit }')"
          printf 'lightwell minimum macOS version: %s\n' "$minimum"
          if [[ "$minimum" != '11.0' ]]; then
            printf 'expected a macOS 11.0 minimum, found %s\n' "$minimum" >&2
            exit 1
          fi

  linux-cli-al2023:
    name: Linux CLI glibc 2.28 + AL2023 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild and Zig
        run: scripts/ci/setup-zigbuild.sh
      - name: Build the CLI with a glibc 2.28 floor
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ci/build-linux-cli.sh "$TARGET"
      - name: Check the glibc floor and smoke on Amazon Linux 2023
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ci/smoke-linux-al2023.sh "target/$TARGET/release" "$GITHUB_WORKSPACE"

  tauri-macos-artifact:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Build the unsigned Apple Silicon app
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app --no-sign
      - name: Check the deployment target and unsigned bundle
        run: |
          app='target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app'
          test -d "$app"
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          test "$minimum" = '11.0'
          if codesign --verify --deep --strict "$app" 2>/dev/null; then
            echo 'Expected an unsigned macOS app, but codesign verified the bundle.' >&2
            exit 1
          fi
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Lightwell-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lightwell-macos-arm64-unsigned
          path: ${{ runner.temp }}/Lightwell-macos-arm64.zip
          if-no-files-found: error

  tauri-macos-signed:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Apple signing credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/sign-macos-app.sh --credential-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Build the unsigned app for signing
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app --no-sign
      - name: Sign and verify the Apple Silicon app
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/sign-macos-app.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app
      - name: Notarize, staple, and validate the app
        env:
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: scripts/ci/notarize-macos-app.sh target/aarch64-apple-darwin/release/bundle/macos/Lightwell.app "$RUNNER_TEMP/Lightwell-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lightwell-macos-arm64-signed
          path: ${{ runner.temp }}/Lightwell-macos-arm64.zip
          if-no-files-found: error

  tauri-linux-artifact:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file imagemagick libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config xvfb xdotool
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.4
      - run: npm ci
      - name: Build the Linux package for the GLIBC 2.28 floor
        env:
          VITE_ENABLE_PROJECT_NOTES: 'true'
        run: npm run tauri:build -- --runner cargo-zigbuild --target x86_64-unknown-linux-gnu --bundles deb --no-sign
      - name: Capture the empty workspace screen from the built app
        run: scripts/ci/capture-open-workspace.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-open-workspace.png"
      - uses: actions/upload-artifact@v4
        with:
          name: lightwell-open-workspace-linux-screenshot
          path: ${{ runner.temp }}/lightwell-open-workspace.png
          if-no-files-found: error
      - name: Capture the live map before and after a Rust source edit
        run: scripts/ci/capture-live-refresh.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-live-refresh"
      - uses: actions/upload-artifact@v4
        with:
          name: lightwell-live-refresh-linux-screenshots
          path: ${{ runner.temp }}/lightwell-live-refresh/*.png
          if-no-files-found: error
      - name: Capture project note editing and stale marking from the built app
        run: scripts/ci/capture-project-notes.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-project-notes"
      - uses: actions/upload-artifact@v4
        with:
          name: lightwell-project-notes-linux-screenshots
          path: ${{ runner.temp }}/lightwell-project-notes/*.png
          if-no-files-found: error
      - name: Capture the source inspector and editor settings from the built app
        run: scripts/ci/capture-source-inspector.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-source-inspector"
      - uses: actions/upload-artifact@v4
        with:
          name: lightwell-source-inspector-linux-screenshots
          path: ${{ runner.temp }}/lightwell-source-inspector/*.png
          if-no-files-found: error
      - name: Exercise the theme picker in the built app
        env:
          CAPTURE_SPLITTERS: ${{ startsWith(github.head_ref, 'm2/draggable-rails') }}
        run: scripts/ci/capture-theme-picker.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-theme-picker" "$CAPTURE_SPLITTERS"
      - uses: actions/upload-artifact@v4
        with:
          name: lightwell-theme-picker-linux-screenshots
          path: ${{ runner.temp }}/lightwell-theme-picker/*.png
          if-no-files-found: error
      - name: Exercise draggable rails and per-project restore
        if: startsWith(github.head_ref, 'm2/draggable-rails')
        run: scripts/ci/capture-splitters.sh target/x86_64-unknown-linux-gnu/release/lightwell "$RUNNER_TEMP/lightwell-splitters"
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(github.head_ref, 'm2/draggable-rails')
        with:
          name: lightwell-splitters-linux-screenshots
          path: ${{ runner.temp }}/lightwell-splitters/*.png
          if-no-files-found: error
      - name: Build the previous header and capture the compact layout
        if: startsWith(github.head_ref, 'm2/compact-header')
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VITE_ENABLE_PROJECT_NOTES: 'true'
        run: |
          set -euo pipefail
          previous_header_sha="$(git log --first-parent --merges -1 --format=%H "$PR_HEAD_SHA")"
          if [[ -z "$previous_header_sha" ]]; then
            previous_header_sha="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          previous_source="$RUNNER_TEMP/lightwell-before-source"
          previous_app="$RUNNER_TEMP/lightwell-before"
          git worktree add --detach "$previous_source" "$previous_header_sha"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$previous_source/node_modules"
          (
            cd "$previous_source"
            npm run tauri:build -- --target x86_64-unknown-linux-gnu --no-bundle -- --locked
          )
          cp "$previous_source/target/x86_64-unknown-linux-gnu/release/lightwell" "$previous_app"
          scripts/ci/capture-compact-header.sh \
            "$previous_app" \
            "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/lightwell" \
            "$RUNNER_TEMP/lightwell-compact-header"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.head_ref, 'm2/compact-header')
        with:
          name: lightwell-compact-header-linux-screenshots
          path: ${{ runner.temp }}/lightwell-compact-header/*.png
          if-no-files-found: error
      - name: Check the package binary's GLIBC requirement
        run: |
          package=$(find target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          mkdir -p "$RUNNER_TEMP/lightwell-deb"
          dpkg-deb -x "$package" "$RUNNER_TEMP/lightwell-deb"
          binary=$(find "$RUNNER_TEMP/lightwell-deb/usr" -type f -executable -name lightwell -print -quit)
          test -n "$binary"
          scripts/ci/check-glibc-floor.sh "$binary" 2.28
      - name: Smoke the packaged binary on Amazon Linux 2023
        run: |
          binary=$(find "$RUNNER_TEMP/lightwell-deb/usr" -type f -executable -name lightwell -print -quit)
          test -n "$binary"
          scripts/ci/smoke-deb-al2023.sh "$(dirname "$binary")" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: lightwell-linux-x86_64-glibc-2.28
          path: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
